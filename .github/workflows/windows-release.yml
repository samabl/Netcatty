name: windows-release

# Windows-only pipeline for this fork: pushing the `win-release` branch (or a
# manual run) builds the Windows x64 packages and publishes them as a GitHub
# Release.
#
# The trigger is a dedicated branch rather than `main` on purpose:
#   - upstream `build.yml` and `test.yml` both watch `main`, so `main` stays
#     reserved for syncing upstream and spawning only the workflows upstream
#     defines;
#   - a main push would otherwise mint a release on every upstream sync.
#
# Deliberately separate from upstream `build.yml`, which runs a three-platform
# matrix and gates publishing behind release secrets a fork does not inherit.

on:
  push:
    branches:
      - win-release
  workflow_dispatch:
    inputs:
      version:
        description: "Version to inject (semver, leading v optional). Empty derives one from the run number."
        type: string
        default: ""
      publish_release:
        description: "Publish a GitHub Release after a successful build"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: build-windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # node-pty, windows-process-tree and sqlite3 are compiled by the
      # postinstall install-app-deps step, so the MSVC environment must exist
      # before npm ci runs.
      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-win-x64-

      - name: Install dependencies
        run: npm ci

      # The et resolver defaults its release owner to GITHUB_REPOSITORY's owner,
      # which on a fork resolves to a nonexistent `<fork>/Netcatty-et-bin` and
      # soft-skips with only a warning. Pin the upstream binary repos instead.
      # --resolve-release queries the GitHub API, and runners share an IP whose
      # unauthenticated quota (60 req/h) is easily exhausted. Both resolvers
      # read GITHUB_TOKEN/GH_TOKEN, so authenticate the lookups.
      - name: Fetch bundled mosh-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOSH_BIN_OWNER: binaricat
          MOSH_BIN_REPO: MoshCatty
        run: npm run fetch:mosh:dev

      - name: Fetch bundled et-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ET_BIN_OWNER: binaricat
          ET_BIN_REPO: Netcatty-et-bin
        run: npm run fetch:et:dev

      # Both fetchers exit 0 when they skip, so assert the binaries really
      # landed - otherwise the release would ship without mosh/et.
      - name: Verify bundled runtimes are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in resources/mosh/win32-x64/mosh-client.exe resources/et/win32-x64/et.exe; do
            if [[ -f "${f}" ]]; then
              echo "ok: ${f} ($(stat -c%s "${f}" 2>/dev/null || echo '?') bytes)"
            else
              echo "::error::bundled runtime missing: ${f}"
              missing=1
            fi
          done
          exit ${missing}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          input_version="${{ inputs.version }}"
          if [[ -n "${input_version}" ]]; then
            version="${input_version#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          # npm pkg and electron-builder both reject non-semver values.
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Resolved version '${version}' is not semver"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Setting version to ${version}"
          npm pkg set version="${version}"

      - name: Build renderer
        env:
          VITE_SYNC_GITHUB_CLIENT_ID: ${{ secrets.VITE_SYNC_GITHUB_CLIENT_ID }}
          VITE_SYNC_GOOGLE_CLIENT_ID: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_ID }}
          VITE_SYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_SECRET }}
          VITE_SYNC_ONEDRIVE_CLIENT_ID: ${{ secrets.VITE_SYNC_ONEDRIVE_CLIENT_ID }}
        run: npm run build

      # --config points at the fork-only wrapper, which is the upstream config
      # plus Azure Trusted Signing options when those secrets exist. PFX
      # signing needs no config at all: electron-builder reads WIN_CSC_LINK and
      # WIN_CSC_KEY_PASSWORD from the environment.
      - name: Package Windows
        env:
          npm_config_arch: x64
          ELECTRON_BUILDER_PUBLISH: "never"
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npx --no-install electron-builder --config scripts/electron-builder.windows-release.cjs --win --x64 --publish=never

      # The `secrets` context is not available in step `if` expressions, so the
      # gate is computed into an env var instead. Without signing secrets this
      # step is a no-op and the build stays unsigned (as before).
      - name: Verify code signatures when signing is configured
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK != '' || secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME != '' }}
        run: |
          if ($env:SIGNING_CONFIGURED -ne 'true') {
            Write-Output 'Signing secrets are absent - skipping signature verification.'
            exit 0
          }
          $exes = @(Get-ChildItem -Path release -Filter '*.exe' -File)
          if ($exes.Count -eq 0) { Write-Error 'No .exe artifacts found to verify.'; exit 1 }
          $unsigned = @()
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '<none>' }
            Write-Output ("{0}: {1} | {2}" -f $exe.Name, $sig.Status, $subject)
            if ($sig.Status -ne 'Valid') { $unsigned += $exe.Name }
          }
          if ($unsigned.Count -gt 0) {
            Write-Error ("Signature missing or invalid for: " + ($unsigned -join ', '))
            exit 1
          }
          Write-Output 'All release executables carry a valid signature.'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: netcatty-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Netcatty v${{ steps.version.outputs.version }} (Windows x64)
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
          token: ${{ secrets.GITHUB_TOKEN }}
